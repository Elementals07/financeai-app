name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install, lint, test, and build web app
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Synchronize Capacitor Android assets
        working-directory: client
        run: npx cap sync android

      - name: Restore dedicated release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.FINANCEAI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Missing GitHub secret FINANCEAI_RELEASE_KEYSTORE_BASE64."
            exit 1
          fi
          KEYSTORE_PATH="$GITHUB_WORKSPACE/client/android/app/release-keystore.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::The decoded release keystore is empty."
            exit 1
          fi

      - name: Build signed release APK
        working-directory: client/android
        env:
          FINANCEAI_RELEASE_STORE_FILE: ${{ github.workspace }}/client/android/app/release-keystore.jks
          FINANCEAI_RELEASE_STORE_PASSWORD: ${{ secrets.FINANCEAI_RELEASE_STORE_PASSWORD }}
          FINANCEAI_RELEASE_KEY_ALIAS: ${{ secrets.FINANCEAI_RELEASE_KEY_ALIAS }}
          FINANCEAI_RELEASE_KEY_PASSWORD: ${{ secrets.FINANCEAI_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and version
        env:
          EXPECTED_VERSION: '1.3.0'
          EXPECTED_APPLICATION_ID: com.elementals.financeai
          EXPECTED_VERSION_CODE: '5'
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$EXPECTED_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$EXPECTED_VERSION."
            exit 1
          fi

          APK_PATH="client/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::Release APK was not created at $APK_PATH."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "::error::Android SDK apksigner or aapt was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK_PATH"
          "$AAPT" dump badging "$APK_PATH" | grep -Fq "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION'"

          mkdir -p apk
          cp "$APK_PATH" apk/FinanceAI.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceAI-Android-v1.3.0
          path: apk/FinanceAI.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' && github.ref_name == 'v1.3.0'
        uses: softprops/action-gh-release@v2
        with:
          name: FinanceAI Android v1.3.0
          draft: false
          prerelease: false
          body: |
            ### FinanceAI Android v1.3.0

            This is a production-signed release of the existing FinanceAI Android app (version code 5). No application functionality or user data formats were changed for this release.

            **Included app capabilities**
            - Local-first expenses, budgets, categories, receipt scanning, and user-initiated SMS import.
            - Optional Gemini AI features using keys configured by the user in AI Settings.
            - Financial data remains stored on the device; selected financial context, receipt images, and SMS text may be sent directly to Google Gemini when the corresponding feature is used.

            **Upgrade compatibility:** The signing certificate used by previously distributed v1.2.2 APKs has not been verified against this release. Android requires the signing certificates to match for an in-place update. If they differ, Android may reject the update; do not uninstall the existing app without first backing up its local data.

            **Privacy:** Gemini keys are stored in browser storage and are not encrypted by FinanceAI. Review Google's terms and privacy policy before using Gemini features.

            **Download:** `FinanceAI.apk` is the signed release APK attached below.
          files: apk/FinanceAI.apk
