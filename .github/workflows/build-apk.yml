name: Build and Release Standalone Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b682449dd4133f4f891319e2e0dd9c" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Build Web Bundle
        working-directory: ./client
        env:
          VITE_AI_API_URL: ${{ secrets.AI_API_URL }}
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./client/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk apk/FinanceAI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceAI-Standalone-APK
          path: apk/FinanceAI.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "FinanceAI Mobile v1.1.0 (Responsive UI and Receipt Save Modes)"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### 📱 FinanceAI Mobile App v1.1.0

            **Local-first finance data with a server-side AI proxy:**
            - 💾 **On-Device Dexie / IndexedDB**: All expenses, budgets, categories, and historical data stored locally.
            - 📊 **Responsive Mobile Dashboard**: Centered doughnut chart, full-width daily spending chart, and mobile-friendly period controls without horizontal overflow.
            - 📸 **Optional Receipt Save Modes**: Review a receipt item by item, or save the full receipt total as a single expense under the default category.
            - 🧾 **Receipt Safeguards**: Duplicate detection, total/date/category validation, and atomic itemized saving remain active in both modes.
            - 📱 **Stable Mobile Actions**: SMS, camera, and add-expense actions now stay in the correct stacked mobile layout.
            - 🤖 **Server-Proxied Gemini**: AI requests use a central proxy with automatic five-key rotation. Gemini keys are never bundled in the APK. A reachable HTTPS `VITE_AI_API_URL` is required for AI features.
            
            **Direct Download:**
            - Tap `FinanceAI.apk` under **Assets** below to download and install.
          files: |
            apk/FinanceAI.apk
