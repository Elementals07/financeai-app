name: Build and Release Standalone Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Ensure Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b682449dd4133f4f891319e2e0dd9c" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | sdkmanager --licenses || true

      - name: Build Web Bundle
        working-directory: ./client
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        working-directory: ./client/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./client/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p apk
          cp client/android/app/build/outputs/apk/debug/app-debug.apk apk/FinanceAI.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceAI-Standalone-APK
          path: apk/FinanceAI.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: "FinanceAI Mobile ${{ github.ref_name }}"
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### FinanceAI Mobile App ${{ github.ref_name }}

            **What's new:**
            - Add and manage up to five personal Gemini API keys in AI Settings, with key validation, masking, and rotation.
            - AI requests use the configured keys directly with Google Gemini. Keys stay in this device's browser storage and are not bundled in the APK.
            - Existing local-first expense, budget, receipt, SMS import, and dashboard features remain available.

            **Privacy:** AI requests send the relevant financial context and, for receipt/SMS features, user-selected content directly to Google Gemini. Review Google's terms and privacy policy before adding a key. Keys in browser storage are not encrypted by FinanceAI.
            
            **Direct Download:**
            - Tap `FinanceAI.apk` under **Assets** below to download and install.
          files: |
            apk/FinanceAI.apk
